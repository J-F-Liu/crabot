[package]
name = "crabot"
version = "0.8.1"
edition = "2024"
description = "A smart and powerful coding agent with native GUI."
license = "MIT"
repository = "https://github.com/J-F-Liu/crabot"

[profile.release]
opt-level = 3

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = "0.17"
home = "0.5"
genai = "=0.7.0-beta.18"
futures = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
iced = { version = "0.14.0", features = [
    "advanced",
    "tokio",
    "highlighter",
    "markdown",
    "image",
    "svg",
] }
iced_runtime = "0.14.0"
iced_selection = "0.5.0"
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.12.4"
glob = "0.3.3"

ignore = "0.4.26"
dunce = "1"
gh-emoji = "1.0.8"
ron = "0.12.2"
fontdb = "0.23"
iced_aw = { version = "0.14.1", features = ["tab_bar"] }
tinytemplate = "1.2.1"
shell-words = "1.1.1"
pulldown-cmark = "0.12"
interprocess = "2"
include_dir = "0.7.4"
rmcp = { version = "2", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "which-command",
] }
http = "1.4.2"
arrayvec = { version = "0.7.8", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["ico"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "gzip",
    "charset",
] }
dom_smoothie = "0.18.0"
htmd = "0.5.4"
open = "5.4.0"
semver = "1.0"
zip = "8.6.0"
flate2 = "1.1.9"
tar = "0.4.46"
memchr = "2"
linkify = "0.11.0"
bashkit = { version = "=0.16.0", default-features = false, features = [
    "realfs",
    "python",
] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
# Pin get-size2 so it keeps using compact_str 0.9, matching ruff_python_ast.
get-size2 = "=0.10.1"
grep-regex = "0.1"
grep-searcher = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1.31"
